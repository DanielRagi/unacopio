<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="UnAcopio">
  <!-- Versión "maskable": el dibujo cabe en el 80% central, que es lo que
       Android deja ver cuando recorta el ícono en círculo o en gota. -->
  <rect width="512" height="512" fill="#065f46"/>

  <defs>
    <clipPath id="pinm">
      <path d="M256 88c-50 0-90 39-90 88 0 60 90 137 90 137s90-77 90-137c0-49-40-88-90-88Z"/>
    </clipPath>
  </defs>

  <g transform="translate(256 268) scale(.6) translate(-256 -256)">
    <path d="M118 240h276v148a26 26 0 0 1-26 26H144a26 26 0 0 1-26-26V240Z" fill="#ffffff" opacity=".95"/>
    <path d="M100 192h312a16 16 0 0 1 16 16v32H84v-32a16 16 0 0 1 16-16Z" fill="#ffffff"/>
    <g clip-path="url(#pinm)">
      <rect x="160" y="80" width="192" height="118" fill="#FCD116"/>
      <rect x="160" y="198" width="192" height="59" fill="#003893"/>
      <rect x="160" y="257" width="192" height="60" fill="#CE1126"/>
    </g>
    <path d="M256 88c-50 0-90 39-90 88 0 60 90 137 90 137s90-77 90-137c0-49-40-88-90-88Z"
          fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  </g>
</svg>
